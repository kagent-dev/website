name = "kagent-website"

compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Enable per-version preview URLs so PR builds (`wrangler versions upload` in
# preview.yaml) get a shareable URL without deploying to production.
preview_urls = true

# esbuild keepNames injects __name() helper calls into functions; next-themes
# stringifies its theme function into an inline <script>, so the helper is
# undefined in the browser ("ReferenceError: t is not defined").
keep_names = false