name = "kagent-website"

compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# worker.mjs wraps the OpenNext Worker (.open-next/worker.js) and adds
# Accept: text/markdown content negotiation for the Hugo docs. run_worker_first
# sends /docs requests to the Worker before the static assets, which is the only
# way the Worker can see them; worker.mjs serves the asset itself when the
# request is not asking for markdown. See the header of worker.mjs.
main = "worker.mjs"
assets = { directory = ".open-next/assets", binding = "ASSETS", run_worker_first = ["/docs/*"] }

# Enable per-version preview URLs so PR builds (`wrangler versions upload` in
# preview.yaml) get a shareable URL without deploying to production.
preview_urls = true

# esbuild keepNames injects __name() helper calls into functions; next-themes
# stringifies its theme function into an inline <script>, so the helper is
# undefined in the browser ("ReferenceError: t is not defined").
keep_names = false