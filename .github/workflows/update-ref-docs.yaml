name: Update Reference Documentation

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'kagent release to generate from, e.g. 1.0.0-alpha2. Defaults to kagent''s latest release.'
        required: false
  # Publishing a release HERE is the switch. Tag it with the kagent release the
  # docs should describe (v1.0.0-alpha2) and the job below reads that tag name.
  # Same pattern as agentgateway/website and kgateway-dev/kgateway.dev, both of
  # which cut a "Docs for vX" release rather than wiring cross-repo credentials.
  release:
    types: [published]

# There is deliberately NO schedule: a nightly run can only ask what kagent
# looks like now, which drifts ahead of what anyone can install.

# Queue overlapping runs (e.g. a manual re-run racing a release) so they don't
# force-push the same PR branch concurrently.
concurrency:
  group: update-ref-docs
  cancel-in-progress: false

# The docs are a Hugo site under docs-site/ (served at /docs). This workflow
# generates the reference pages directly as Hugo markdown into docs-site/content:
#   - kagent CRD API ref -> docs-site/content/kagent/1.x/reference/api-ref.md
#   - kmcp CRD API ref   -> docs-site/content/kmcp/reference/api-ref.md
#   - kagent Helm ref    -> docs-site/content/kagent/1.x/reference/helm.md
# Each page uses plain Hugo YAML frontmatter (no MDX `export const metadata`).
#
# It also refreshes the version conrefs under
# docs-site/assets/kagent-docs/versions/ (plus the second copy of the Kubernetes
# version at public/docs/versions/max-kube.md). Those steps run first, because
# the API reference is generated against the Kubernetes version they write.
# Conrefs and reference pages share ONE pull request on purpose: this repo
# already receives a dozen or so automated PRs a day, and splitting these would
# add another for a diff that is usually empty. When a conref does move, the PR
# title and body say so, because that case needs the guides re-tested rather
# than a routine review.
#
# This job generates from a kagent RELEASE TAG, never from main. It ran nightly
# against main until 2026-09-22, and the 2026-09-22 run is what that cost:
# KagentHarnessCompaction and KagentHarnessSummarizer documented on pages whose
# `helm install --version` line said alpha1, a release neither type exists in.
#
# BOTH documented lines are generated here, each from its own release tag.
# 0.10.x is the stable line and still takes patches -- v0.10.2 landed on
# 2026-09-23 -- so it is not frozen, and the by-hand regeneration it used to
# need is what let its pages drift in the first place. Publishing a docs
# release tagged v0.10.2 regenerates 0.x; v1.0.0-alphaN regenerates 1.x.
#
# The two must never write each other's values. Every conref a page of either
# line reads is version-split, and the conref helper refuses to continue if a
# span outside the running line moves. The conrefs that are still flat --
# kmcp, kagent-tools, the runtime images -- are read only by 1.x pages, so a
# 0.x run skips them entirely rather than filling them from the 0.10.x tree.
#
# That is not hypothetical -- it happened to all three before this job was
# retargeted, in three different shapes, none of which failed a build:
#
#   - cli/    gained the gRPC transport flags (--kagent-grpc-url and friends,
#             kagent #2362) across 42 pages. Real flags, wrong release line.
#   - helm.md LOST all ten agent subcharts and their values -- 258 documented
#             keys where the 0.10.1 chart has 337.
#   - api-ref.md kept the right API version (v1alpha2) and so looked clean, but
#             carried topologySpreadConstraints (absent at v0.10.1), missed
#             executeCodeBlocks (present at v0.10.1), and pinned every
#             Kubernetes doc link to v1.31 from the old max-kube drift.
#
# All three were regenerated from the v0.10.1 tag on 2026-09-15. Regenerate from
# that TAG, never from main, if they ever need rebuilding. For the CLI pages:
#
#   git -C kagent worktree add --detach /tmp/kagent-0x v0.10.1
#   (cd /tmp/kagent-0x/go && go build -o /tmp/kagent-cli-0x ./core/cli/cmd/kagent)
#   python3 scripts/generate-cli-docs.py --binary /tmp/kagent-cli-0x \
#     --display-name kagent --out-dir docs-site/content/kagent/0.x/resources/cli \
#     --url-prefix /docs/kagent/0.x/resources/cli --weight 1
#
# No --link-prefix on 0.x: it is not rebased into the enterprise hub, so its
# generated cross-links stay root-relative URLs. The job sets that per line.
#
# The section is named reference/ in 1.x, not resources/ as in 0.x, and the
# provider pages link to crd-ref-docs anchors (#modelconfigspec, #openaiconfig,
# ...), so keep that renderer and its anchor naming.
#
# crd-ref-docs is pinned at v0.3.0, and the floor is not negotiable: Setup Go
# below asks for 'stable', so every `go run <tool>@<pin>` here is rebuilt
# against whatever Go the runner has that morning. v0.1.0 depends on
# golang.org/x/tools v0.19.0, whose internal/tokeninternal carries a
# compile-time size assertion on go/token.File. Go 1.27 changed that struct, so
# from 2026-09-22 the build died with "invalid array length -delta * delta"
# before generating anything. x/tools dropped the file in v0.35.0, so v0.2.0 is
# the oldest release that builds at all. Do not pin back below it.
#
# All 74 headings are identical across v0.1.0, v0.2.0 and v0.3.0, so the
# provider-page anchors above survive any of them. The versions differ only in
# the table bodies:
#
#   - v0.2.0 collapses blank lines inside Go doc comments, so <br /><br />
#     flattens to <br /> in about seven prose-heavy fields. v0.3.0 does the
#     same; there is no version that both builds and keeps those breaks.
#   - v0.3.0 marks required fields, which nothing before it did. That is the
#     reason for preferring it: the reference had no way to tell a required
#     field from an optional one. It pays for that by stamping all 244 rows of
#     the Validation column, so the generation steps below normalize the
#     markers -- see the comment there.
#
# Frontmatter lives in the heredocs below, not in the generated pages: every
# run overwrites it. Descriptions follow the 1.x convention of an imperative
# verb and a full sentence.
jobs:
  # Decides WHICH kagent release this run documents, and whether there is
  # anything to do. Split into its own job so the answer is available to the
  # checkout steps below, which run before any script could compute it.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      kagent_tag: ${{ steps.pick.outputs.kagent_tag }}
      kagent_version: ${{ steps.pick.outputs.kagent_version }}
      line: ${{ steps.pick.outputs.line }}
      kmcp_tag: ${{ steps.pick.outputs.kmcp_tag }}
      proceed: ${{ steps.pick.outputs.proceed }}
    steps:
      - name: Resolve the kagent release to document
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          # A docs release's tag names the kagent release to document; a manual
          # run can name one directly. Neither is set on a re-run with no input,
          # which falls through to kagent's latest release below.
          REQUESTED: ${{ github.event.release.tag_name || github.event.inputs.version || '' }}
        run: |
          set -euo pipefail

          # An explicit version wins, whether it came from a docs release tag or
          # a manual run.
          #
          # The fallback avoids `gh release view`, which returns the release
          # GitHub marks "Latest" -- the newest STABLE release. That is
          # correctly a 0.10.x one today: 0.10.x is the stable line, and 1.0 is
          # still shipping as alpha prereleases, which should not be Latest. It
          # is simply the answer to a different question than this job asks.
          # These are the 1.x pages, so it wants the newest 1.x release whether
          # or not that line is the stable one.
          if [ -n "$REQUESTED" ]; then
            KAGENT_TAG="v${REQUESTED#v}"
            echo "Version requested explicitly: $KAGENT_TAG"
          else
            KAGENT_TAG=$(gh release list --repo "$OWNER/kagent" --limit 50 \
              --json tagName,isDraft \
              -q '[.[] | select(.isDraft == false) | select(.tagName | startswith("v1."))] | .[0].tagName')
            if [ -z "$KAGENT_TAG" ]; then
              echo "Error: no 1.x release found in $OWNER/kagent. Name a version explicitly."
              exit 1
            fi
            echo "Using kagent's newest 1.x release: $KAGENT_TAG"
            echo "Name a 0.10.x version explicitly to regenerate the 0.x line instead."
          fi

          KAGENT_VERSION="${KAGENT_TAG#v}"
          if ! printf '%s' "$KAGENT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Error: resolved '$KAGENT_VERSION', which is not a version. Refusing to generate."
            exit 1
          fi

          # Which documented line this release belongs to. Both are live: 0.10.x
          # is the stable line and still takes patches, 1.0 is the alpha line.
          # Everything downstream -- page paths, API version, frontmatter,
          # which conrefs are in scope -- follows from this.
          case "$KAGENT_VERSION" in
            0.*) LINE=0.x ;;
            1.*) LINE=1.x ;;
            *)   echo "Error: $KAGENT_VERSION belongs to no documented line. Only 0.x and 1.x exist."; exit 1 ;;
          esac
          echo "Documenting the $LINE line."
          echo "line=$LINE" >> "$GITHUB_OUTPUT"

          # Prove the tag exists before four later steps assume it does.
          if ! gh api "repos/$OWNER/kagent/git/ref/tags/$KAGENT_TAG" >/dev/null 2>&1; then
            echo "Error: $OWNER/kagent has no tag $KAGENT_TAG."
            exit 1
          fi

          # kmcp is unversioned in the docs and released on its own cadence, so
          # it gets its own latest release rather than anything derived from the
          # kagent tag. Still a release, not main, for the same reason.
          KMCP_TAG=$(gh release view --repo "$OWNER/kmcp" --json tagName -q .tagName)
          echo "Using kmcp's latest release: $KMCP_TAG"

          {
            echo "kagent_tag=$KAGENT_TAG"
            echo "kagent_version=$KAGENT_VERSION"
            echo "kmcp_tag=$KMCP_TAG"
          } >> "$GITHUB_OUTPUT"

          # Every trigger this workflow has is deliberate, so every run proceeds.
          # Re-running the same release is fine and sometimes necessary -- to
          # pick up images that were still pushing, or to regenerate after a
          # docs-side change like a renderer bump.
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  generate-api-docs:
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    # Target Hugo content paths (relative to the website checkout).
    env:
      # The release this run documents. Every conref, both checkouts, the
      # runtime image digests and the CLI binaries derive from it.
      KAGENT_VERSION: ${{ needs.resolve.outputs.kagent_version }}
      KAGENT_TAG: ${{ needs.resolve.outputs.kagent_tag }}
      KMCP_TAG: ${{ needs.resolve.outputs.kmcp_tag }}
      LINE: ${{ needs.resolve.outputs.line }}
      # kagent paths are per-line and set by "Resolve line configuration"
      # below. kmcp is unversioned, so its targets are fixed.
      KMCP_API_PAGE: docs-site/content/kmcp/reference/api-ref.md
      KMCP_CLI_DIR: docs-site/content/kmcp/reference/cli
      KMCP_CLI_URL_PREFIX: /docs/kmcp/reference/cli
      VERSIONS_DIR: website/docs-site/assets/kagent-docs/versions
      # A second copy of the Kubernetes version that nothing but this workflow
      # reads -- the docs render the assets/ conref. Kept in step with the 1.x
      # value and not written on 0.x runs, so the two lines cannot fight over
      # one flat file. It used to be fed to crd-ref-docs as KUBE_VERSION; that
      # round-trip is gone, the value now comes straight from the resolved tree.
      KUBE_VERSION_FILE: website/public/docs/versions/max-kube.md

    steps:
      # Both checkouts are pinned to a release tag. Checking out main here is
      # what let the reference describe unreleased code; see the header comment.
      - name: Checkout kagent repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/kagent
          ref: ${{ needs.resolve.outputs.kagent_tag }}
          path: kagent

      - name: Checkout kmcp repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/kmcp
          ref: ${{ needs.resolve.outputs.kmcp_tag }}
          path: kmcp

      - name: Checkout docs repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/website
          path: website

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false

      - name: Set kagent commit SHA
        run: echo "KAGENT_COMMIT=$(cd kagent && git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set kmcp commit SHA
        run: echo "KMCP_COMMIT=$(cd kmcp && git rev-parse --short HEAD)" >> $GITHUB_ENV

      # Everything that differs between the two documented lines, in one place.
      # 0.x and 1.x disagree on more than a path segment: the section is named
      # resources/ in 0.x and reference/ in 1.x, 0.x ships v1alpha2 where 1.x
      # ships v1alpha3, the frontmatter differs down to linkTitle and weight,
      # and 0.x predates Harness so it pins no runtime images.
      - name: Resolve line configuration
        run: |
          set -euo pipefail

          case "$LINE" in
            0.x)
              SECTION=resources
              API_DIR=go/api/v1alpha2
              API_TITLE="API Reference"
              API_LINK_TITLE="API docs"
              API_DESC="kagent API reference documentation"
              API_WEIGHT=1
              HELM_TITLE="kagent"
              HELM_LINK_TITLE="Helm Chart Configuration"
              HELM_DESC="kagent Helm chart configuration reference"
              HELM_WEIGHT=2
              CLI_WEIGHT=1
              # No --link-prefix on 0.x: it is not rebased into the enterprise
              # hub, so its generated cross-links stay root-relative URLs.
              KAGENT_CLI_LINK_PREFIX=""
              # 0.x predates Harness and pins no runtime image, and its pages
              # read none of the 1.x-only conrefs.
              WITH_RUNTIME_IMAGES=false
              WITH_KMCP=false
              ;;
            1.x)
              SECTION=reference
              API_DIR=go/api/v1alpha3
              API_TITLE="API reference"
              API_LINK_TITLE=""
              API_DESC="Look up every field in the kagent v1alpha3 custom resources, including AgentTemplate, Harness, ModelConfig, and RemoteMCPServer."
              API_WEIGHT=10
              HELM_TITLE="Helm reference"
              HELM_LINK_TITLE=""
              HELM_DESC="Look up the configurable values in the kagent Helm chart, including their defaults and types."
              HELM_WEIGHT=20
              # --weight 30 slots CLI docs after api-ref (10) and helm (20).
              CLI_WEIGHT=30
              # Version-root-relative path behind the `link` shortcode. 1.x
              # pages are rebased into the enterprise docs hub, so their
              # cross-links must not hardcode the 1.x segment.
              KAGENT_CLI_LINK_PREFIX=reference/cli
              WITH_RUNTIME_IMAGES=true
              WITH_KMCP=true
              ;;
            *)
              echo "Error: unknown line '$LINE'."
              exit 1
              ;;
          esac

          {
            echo "SECTION=$SECTION"
            echo "API_DIR=$API_DIR"
            echo "KAGENT_API_PAGE=docs-site/content/kagent/$LINE/$SECTION/api-ref.md"
            echo "HELM_PAGE=docs-site/content/kagent/$LINE/$SECTION/helm.md"
            echo "KAGENT_CLI_DIR=docs-site/content/kagent/$LINE/$SECTION/cli"
            echo "KAGENT_CLI_URL_PREFIX=/docs/kagent/$LINE/$SECTION/cli"
            echo "KAGENT_CLI_LINK_PREFIX=$KAGENT_CLI_LINK_PREFIX"
            echo "API_TITLE=$API_TITLE"
            echo "API_LINK_TITLE=$API_LINK_TITLE"
            echo "API_DESC=$API_DESC"
            echo "API_WEIGHT=$API_WEIGHT"
            echo "HELM_TITLE=$HELM_TITLE"
            echo "HELM_LINK_TITLE=$HELM_LINK_TITLE"
            echo "HELM_DESC=$HELM_DESC"
            echo "HELM_WEIGHT=$HELM_WEIGHT"
            echo "CLI_WEIGHT=$CLI_WEIGHT"
            echo "WITH_RUNTIME_IMAGES=$WITH_RUNTIME_IMAGES"
            echo "WITH_KMCP=$WITH_KMCP"
          } >> $GITHUB_ENV

          echo "Line $LINE -> content/kagent/$LINE/$SECTION/, $API_DIR"

      # ---------------------------------------------------------------------
      # Version conrefs.
      #
      # These run BEFORE "Read max Kubernetes version" on purpose: that step
      # feeds public/docs/versions/max-kube.md to crd-ref-docs as KUBE_VERSION,
      # so correcting the conrefs first means the API reference is generated
      # against the fresh value in the same run rather than a run later.
      #
      # Each value is read from the same place kagent's own build reads it, so
      # the docs and the release artifact cannot disagree. helm/kagent/Chart.yaml
      # is NOT a source: it is gitignored and generated from Chart-template.yaml
      # by envsubst, so a checkout never carries a useful value.
      #
      # kagent.md was editorial while this ran from main, where `git describe`
      # only yields a dev tag. A release tag IS the release the docs describe,
      # so it is written from that like everything else here.
      #
      # Also not automated: jaeger / loki / tempo / otel-collector are pinned
      # nowhere in kagent, so the only source is "latest upstream", which would
      # assert chart versions no guide was tested against.
      # ---------------------------------------------------------------------
      - name: Read versions from kagent
        run: |
          set -euo pipefail

          MAKEFILE="kagent/Makefile"
          GOMOD="kagent/go/go.mod"
          CHART_TEMPLATE="kagent/helm/kagent/Chart-template.yaml"

          for f in "$MAKEFILE" "$GOMOD" "$CHART_TEMPLATE"; do
            if [ ! -f "$f" ]; then
              echo "Error: expected $f in the kagent checkout"
              exit 1
            fi
          done

          # Field 5 of the replace directive:
          #   replace github.com/agent-substrate/substrate => github.com/kagent-dev/substrate v0.0.29
          SUBSTRATE_VERSION=$(awk '/github\.com\/kagent-dev\/substrate/ { print substr($5, 2) }' "$GOMOD" | head -1)
          # Field 2 of the require line.
          KMCP_VERSION=$(awk '/github\.com\/kagent-dev\/kmcp/ { print substr($2, 2) }' "$GOMOD" | head -1)
          # kagent-tools carries a literal version in the template, not a ${VAR}.
          KAGENT_TOOLS_VERSION=$(awk '/name: kagent-tools/{f=1} f&&/version:/{print $2; exit}' "$CHART_TEMPLATE")
          # KIND_IMAGE_VERSION is a full x.y.z; the conref carries major.minor.
          MAX_KUBE=$(sed -n 's/^KIND_IMAGE_VERSION[[:space:]]*?*=[[:space:]]*\([0-9]*\.[0-9]*\).*/\1/p' "$MAKEFILE" | head -1)

          # Fail loudly on an unexpected shape. An empty value would otherwise
          # blank a conref and silently break every command that reuses it.
          check() {
            if ! printf '%s' "$2" | grep -Eq "$3"; then
              echo "Error: $1 extracted as '$2', which does not match $3."
              echo "The source file's shape likely changed in kagent. Fix the extraction here rather than editing the conref by hand."
              exit 1
            fi
            echo "  $1 = $2"
          }

          # x.y.z with an OPTIONAL prerelease suffix. The suffix is not
          # hypothetical: kagent 1.0 pins Agent Substrate at 0.2.0-beta4, and a
          # bare-triple pattern rejected it and killed this step -- and with it
          # the API reference regeneration downstream, which runs later in the
          # same job. Component versions go through prerelease lines routinely;
          # only the value's SHAPE is being guarded here, not its maturity.
          SEMVER='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

          echo "Extracted from kagent ${KAGENT_COMMIT}:"
          check SUBSTRATE_VERSION    "$SUBSTRATE_VERSION"    "$SEMVER"
          check KMCP_VERSION         "$KMCP_VERSION"         "$SEMVER"
          check KAGENT_TOOLS_VERSION "$KAGENT_TOOLS_VERSION" "$SEMVER"
          check MAX_KUBE             "$MAX_KUBE"             '^[0-9]+\.[0-9]+$'

          {
            echo "SUBSTRATE_VERSION=$SUBSTRATE_VERSION"
            echo "KMCP_VERSION=$KMCP_VERSION"
            echo "KAGENT_TOOLS_VERSION=$KAGENT_TOOLS_VERSION"
            echo "MAX_KUBE=$MAX_KUBE"
          } >> $GITHUB_ENV

      # ---------------------------------------------------------------------
      # Runtime image conrefs.
      #
      # versions/runtime-image.md and versions/runtime-image-claude.md hold a
      # FULL digest-pinned reference (repository@sha256:...), not a version,
      # because a Harness `workload.image` rejects a bare tag -- a revision has
      # to be reproducible. Pages reuse the whole string, so the repository name
      # is not hardcoded on any page either.
      #
      # A digest exists only once the image is pushed, so unlike every value
      # above this one is read from the REGISTRY rather than from a file in the
      # kagent tree. The tag to resolve comes from versions/kagent.md, not from
      # `git describe` on main: that conref names the release the docs describe,
      # so resolving against it is what keeps the image a reader pins consistent
      # with the chart version the install page tells them to install. It also
      # means these two follow automatically whenever kagent.md is bumped by
      # hand, which is the reason that one stays editorial.
      #
      # Image names are NOT the ones the kagent tree suggests. The kagent
      # runtime is golang-adk (values.yaml calls it `agentImage`); the claude
      # runtime is claude-harness. The `claude-adk` and `codex-adk` strings in
      # kagent are build stages, and nothing is published under those names.
      #
      # 0.x needs no equivalent: it predates Harness and pins no runtime image.
      # ---------------------------------------------------------------------
      - name: Resolve runtime image digests
        if: env.WITH_RUNTIME_IMAGES == 'true'
        run: |
          set -euo pipefail

          # The release being documented, not whatever versions/kagent.md holds.
          # This step used to read the conref, which worked only while that file
          # was editorial and updated ahead of the run. Now that the same run
          # writes it, reading it here would pin the images one release behind.
          IMAGE_TAG="$KAGENT_VERSION"
          echo "Resolving runtime images at tag $IMAGE_TAG (the release being documented)"

          # Anonymous pull token; these packages are public. Deliberately not
          # crane or `docker buildx imagetools`: neither is on this runner, and
          # a HEAD against the registry needs no setup step.
          ghcr_digest() {
            local repo="$1" tag="$2" token
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" \
              | sed -n 's/.*"token":"\([^"]*\)".*/\1/p') || return 1
            [ -n "$token" ] || return 1
            # Index media types FIRST. These images are multi-arch and the value
            # to pin is the index digest; an Accept header that omits the index
            # types still succeeds but hands back ONE platform's digest, which
            # would pin every reader to the runner's architecture.
            curl -fsSI -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${repo}/manifests/${tag}" \
              | awk -F': ' 'tolower($1)=="docker-content-digest"{gsub(/\r/,"");print $2}'
          }

          # conref basename : GHCR repository
          RUNTIME_IMAGES="runtime-image:kagent-dev/kagent/golang-adk
          runtime-image-claude:kagent-dev/kagent/claude-harness"

          UNRESOLVED=""
          while IFS= read -r line; do
            line=$(printf '%s' "$line" | tr -d '[:space:]')
            [ -n "$line" ] || continue
            name="${line%%:*}"
            repo="${line#*:}"

            digest=$(ghcr_digest "$repo" "$IMAGE_TAG" || true)

            # NOT fatal: a release can be published before its images finish
            # pushing, so a run triggered by it can arrive early. An empty
            # conref would blank a `workload.image` line on four pages, so the
            # value is left alone and the miss goes in the PR body instead.
            # Re-run this workflow once the images land.
            if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::warning::Could not resolve a digest for ${repo}:${IMAGE_TAG}. Leaving its conref unchanged."
              UNRESOLVED="${UNRESOLVED}\`${repo}:${IMAGE_TAG}\` "
              continue
            fi

            # runtime-image -> RUNTIME_IMAGE, runtime-image-claude -> RUNTIME_IMAGE_CLAUDE
            var=$(printf '%s' "$name" | tr 'a-z-' 'A-Z_')
            # ghcr.io/ is prepended here rather than carried in the table
            # above, because the table's value doubles as the registry API path,
            # which takes the repository WITHOUT the host.
            echo "  ${name}.md = ghcr.io/${repo}@${digest}"
            echo "${var}=ghcr.io/${repo}@${digest}" >> $GITHUB_ENV
          done <<< "$RUNTIME_IMAGES"

          if [ -n "$UNRESOLVED" ]; then
            echo "RUNTIME_IMAGE_NOTE=> [!WARNING] No digest resolved for ${UNRESOLVED}- those conrefs keep their previous value. Expected when versions/kagent.md names a release whose images are not published yet." >> $GITHUB_ENV
          else
            echo "RUNTIME_IMAGE_NOTE=" >> $GITHUB_ENV
          fi

      - name: Cross-check kmcp against its own latest release
        if: env.WITH_KMCP == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Two different facts, split into two conrefs in 2026-09-22 when kmcp
          # 0.4.0 broke the tie that had made them look like one (kagent alpha1
          # and alpha2 both pin 0.3.0). kmcp.md is what kagent bundles, for the
          # 1.x support matrix. kmcp-latest.md is kmcp's newest release, for the
          # standalone kmcp guides, which render it inside sample CLI output
          # reading "using latest: v..." -- a claim kagent's pin would falsify.
          KMCP_LATEST=$(gh release view \
            --repo "${{ github.repository_owner }}/kmcp" \
            --json tagName -q .tagName 2>/dev/null | sed 's/^v//' || true)

          # Empty would blank the conref and break the sample output on two
          # pages, so an unreadable release leaves kmcp-latest.md alone.
          if [ -z "$KMCP_LATEST" ]; then
            echo "::warning::Could not read kmcp's latest release. Leaving versions/kmcp-latest.md unchanged."
            echo "KMCP_LATEST=" >> $GITHUB_ENV
            echo "KMCP_MISMATCH=" >> $GITHUB_ENV
            exit 0
          fi

          echo "KMCP_LATEST=$KMCP_LATEST" >> $GITHUB_ENV

          # A divergence is now expected and handled, so it is reported rather
          # than warned about. It is still worth saying out loud: it means the
          # kagent support matrix and the kmcp guides name different versions on
          # purpose, which looks like a bug to anyone who has not read this.
          if [ "$KMCP_LATEST" != "$KMCP_VERSION" ]; then
            echo "kmcp split: kagent pins $KMCP_VERSION, kmcp's latest release is $KMCP_LATEST. Writing both."
            echo "KMCP_MISMATCH=\`versions/kmcp.md\` is \`$KMCP_VERSION\` (what kagent bundles) and \`versions/kmcp-latest.md\` is \`$KMCP_LATEST\` (kmcp's newest release). The two naming different versions is expected -- the kagent support matrix and the standalone kmcp guides are answering different questions." >> $GITHUB_ENV
          else
            echo "kmcp: kagent's pin and kmcp's latest release are both $KMCP_VERSION."
            echo "KMCP_MISMATCH=" >> $GITHUB_ENV
          fi

      - name: Update version conrefs
        run: |
          set -euo pipefail

          if [ ! -d "$VERSIONS_DIR" ]; then
            echo "Error: $VERSIONS_DIR not found in the docs checkout"
            exit 1
          fi

          # These files carry NO trailing newline, and must not gain one: they
          # render inline into shell commands like `--version {{< reuse ... >}} \`,
          # where a newline would split the command. Always printf, never echo.
          write_conref() {
            local file="$1" value="$2"
            if [ ! -f "$file" ]; then
              echo "Error: expected conref $file"
              exit 1
            fi
            local before
            before=$(cat "$file")
            printf '%s' "$value" > "$file"
            if [ "$before" != "$value" ]; then
              echo "  $(basename "$file"): $before -> $value"
            else
              echo "  $(basename "$file"): unchanged ($value)"
            fi
          }

          # Version-split conrefs. Each carries one span per documented line:
          #   {{< version include-if="0.x" >}}A{{< /version >}}{{< version include-if="1.x" >}}B{{< /version >}}
          # Only this run's span is written, and the helper refuses to continue
          # if any other span moved -- that assertion is the whole safety net
          # keeping a 0.10.x run from rewriting 1.x values and vice versa.
          #
          # Read, substitute and write the whole file rather than sed -i:
          # whether sed -i appends a trailing newline to a file that lacked one
          # is unspecified by POSIX, and these files must never gain one. They
          # render inline into shell commands like `--version {{< reuse ... >}} \`,
          # where a newline would split the command.
          write_span_conref() {
            local file="$1" span="$2" value="$3"
            if [ ! -f "$file" ]; then
              echo "Error: expected conref $file"
              exit 1
            fi
            python3 - "$file" "$span" "$value" <<'PY_SPAN'
          import re, sys

          path, span, value = sys.argv[1], sys.argv[2], sys.argv[3]
          pattern = re.compile(r'\{\{< version include-if="([^"]+)" >\}\}(.*?)\{\{< /version >\}\}')

          text = open(path).read()
          before = dict(pattern.findall(text))
          if span not in before:
              sys.exit(f"Error: {path} has no {span} span. Found: {sorted(before)}")

          def sub(m):
              return m.group(0) if m.group(1) != span else (
                  f'{{{{< version include-if="{span}" >}}}}{value}{{{{< /version >}}}}')

          new = pattern.sub(sub, text)
          after = dict(pattern.findall(new))

          if after[span] != value:
              sys.exit(f"Error: the {span} span of {path} did not take {value!r}.")
          moved = [k for k in before if k != span and before[k] != after.get(k)]
          if moved:
              sys.exit(f"Error: {path} changed spans this run must not touch: {moved}. Refusing to continue.")

          open(path, "w").write(new)
          name = path.rsplit("/", 1)[-1]
          others = ", ".join(f"{k} left at {before[k]}" for k in sorted(before) if k != span)
          if before[span] != value:
              print(f"  {name} {span} span: {before[span]} -> {value} ({others})")
          else:
              print(f"  {name} {span} span: unchanged ({value})")
          PY_SPAN
          }

          echo "Version-split conrefs (writing the $LINE span):"
          write_span_conref "$VERSIONS_DIR/kagent.md"          "$LINE" "$KAGENT_VERSION"
          write_span_conref "$VERSIONS_DIR/agent-substrate.md" "$LINE" "$SUBSTRATE_VERSION"
          write_span_conref "$VERSIONS_DIR/max-kube.md"        "$LINE" "$MAX_KUBE"

          # Flat conrefs, read only by 1.x pages. On a 0.x run their values
          # would come from the 0.10.x tree and silently replace what the 1.x
          # pages render, so they are not in scope for that line at all.
          if [ "$WITH_KMCP" != "true" ]; then
            echo "Flat conrefs: SKIPPED. No 0.x page reads kmcp, kagent-tools or the runtime images."
          else
            # No trailing newline here either; see write_span_conref above.
            write_conref() {
              local file="$1" value="$2"
              if [ ! -f "$file" ]; then
                echo "Error: expected conref $file"
                exit 1
              fi
              local before
              before=$(cat "$file")
              printf '%s' "$value" > "$file"
              if [ "$before" != "$value" ]; then
                echo "  $(basename "$file"): $before -> $value"
              else
                echo "  $(basename "$file"): unchanged ($value)"
              fi
            }

            echo "Flat conrefs:"
            write_conref "$VERSIONS_DIR/kmcp.md"         "$KMCP_VERSION"
            # Only when it resolved; see the cross-check step above.
            if [ -n "${KMCP_LATEST:-}" ]; then
              write_conref "$VERSIONS_DIR/kmcp-latest.md" "$KMCP_LATEST"
            else
              echo "  kmcp-latest.md: SKIPPED, kmcp's latest release was unreadable. Left at $(cat "$VERSIONS_DIR/kmcp-latest.md")"
            fi
            write_conref "$VERSIONS_DIR/kagent-tools.md" "$KAGENT_TOOLS_VERSION"
            # Nothing but this workflow reads this copy; kept level with 1.x.
            write_conref "$KUBE_VERSION_FILE"            "$MAX_KUBE"

            # Written only when the digest resolved. An empty value would blank
            # the `workload.image` line on four 1.x pages, so an unresolved
            # lookup keeps the previous value rather than writing a broken one.
            # The miss was already warned about upstream and is repeated in the
            # PR body.
            echo "Runtime image conrefs:"
            if [ -n "${RUNTIME_IMAGE:-}" ]; then
              write_conref "$VERSIONS_DIR/runtime-image.md" "$RUNTIME_IMAGE"
            else
              echo "  runtime-image.md: SKIPPED, unresolved digest. Left at $(cat "$VERSIONS_DIR/runtime-image.md")"
            fi
            if [ -n "${RUNTIME_IMAGE_CLAUDE:-}" ]; then
              write_conref "$VERSIONS_DIR/runtime-image-claude.md" "$RUNTIME_IMAGE_CLAUDE"
            else
              echo "  runtime-image-claude.md: SKIPPED, unresolved digest. Left at $(cat "$VERSIONS_DIR/runtime-image-claude.md")"
            fi
          fi

      # Three fragments of the PR body that exist only on a 1.x run. Built here
      # rather than inline, because a GitHub expression string cannot span
      # lines and these are table rows.
      - name: Compose the line-dependent PR body fragments
        run: |
          set -euo pipefail

          if [ "$WITH_KMCP" = "true" ]; then
            {
              echo "KMCP_SOURCE_LINE=- **kmcp**: [\`${KMCP_TAG}\`](https://github.com/${{ github.repository_owner }}/kmcp/releases/tag/${KMCP_TAG}) (\`${KMCP_COMMIT}\`)"
              echo "LINE_SCOPE_NOTE="
              echo "FLAT_CONREF_ROWS<<ROWS_EOF"
              echo "| \`kmcp\` | \`${KMCP_VERSION}\` | \`go/go.mod\` require (what kagent bundles) |"
              echo "| \`kmcp-latest\` | \`${KMCP_LATEST:-unresolved}\` | kmcp's latest release (what the kmcp guides show) |"
              echo "| \`kagent-tools\` | \`${KAGENT_TOOLS_VERSION}\` | \`helm/kagent/Chart-template.yaml\` |"
              echo "| \`runtime-image\` | \`${RUNTIME_IMAGE:-unresolved}\` | GHCR, at \`${KAGENT_TAG}\` |"
              echo "| \`runtime-image-claude\` | \`${RUNTIME_IMAGE_CLAUDE:-unresolved}\` | GHCR, at \`${KAGENT_TAG}\` |"
              echo "ROWS_EOF"
            } >> $GITHUB_ENV
          else
            {
              echo "KMCP_SOURCE_LINE="
              echo "LINE_SCOPE_NOTE=No kmcp, kagent-tools or runtime-image conref is touched on a $LINE run: no $LINE page reads them, and their values would come from the ${KAGENT_VERSION%%.*}.x tree."
              echo "FLAT_CONREF_ROWS="
            } >> $GITHUB_ENV
          fi

      - name: Flag whether the conrefs moved
        run: |
          set -euo pipefail
          cd website
          # Drives the re-test callout in the PR body below. Most nights this is
          # empty and the PR is a routine reference regeneration.
          if git diff --quiet -- docs-site/assets/kagent-docs/versions public/docs/versions; then
            echo "CONREFS_CHANGED=" >> $GITHUB_ENV
            echo "CONREF_NOTE=" >> $GITHUB_ENV
            echo "No conref changes this run; this is a routine reference regeneration."
          else
            echo "CONREFS_CHANGED=1" >> $GITHUB_ENV
            echo "Conref changes in this run:"
            git diff --stat -- docs-site/assets/kagent-docs/versions public/docs/versions
            # Multi-line env value, so the PR body can carry a real callout.
            {
              echo "CONREF_NOTE<<CONREF_NOTE_EOF"
              echo "> [!IMPORTANT]"
              echo "> **A version conref moved in this run, so this is not a routine regeneration.**"
              echo "> These values render into \`helm install --version\` lines that readers copy out of"
              echo "> \`setup/installation.md\`, \`observability/tracing.md\`, and \`observability/audit-prompts.md\`."
              echo "> Merging asserts the guides work against the versions below, so re-test the affected"
              echo "> guides rather than merging on green CI alone."
              echo ""
              echo '```diff'
              git diff -- docs-site/assets/kagent-docs/versions public/docs/versions | sed -n 's/^\([+-][^+-]\)/\1/p'
              echo '```'
              echo "CONREF_NOTE_EOF"
            } >> $GITHUB_ENV
          fi

      - name: Verify API directory exists
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/kagent/$API_DIR" ]; then
            echo "Error: API directory not found at $GITHUB_WORKSPACE/kagent/$API_DIR"
            echo "The $LINE line expects $API_DIR at tag $KAGENT_TAG."
            ls -la "$GITHUB_WORKSPACE/kagent/go/api/"
            exit 1
          fi
          echo "API directory $API_DIR found and verified"

      - name: Set the Kubernetes version for generation
        run: |
          # Straight from the tag being documented, not from a committed file.
          # This used to read public/docs/versions/max-kube.md, which is flat
          # and shared, so a 0.x run would have generated 1.x's value.
          echo "KUBE_VERSION=$MAX_KUBE" >> $GITHUB_ENV
          echo "Generating against Kubernetes $MAX_KUBE (from $KAGENT_TAG)"

      - name: Generate API Reference
        run: |
          # Substitute KUBE_VERSION in the config template and write to a temp file
          cd "$GITHUB_WORKSPACE/website"
          if [ ! -f "scripts/crd-ref-docs-config.yaml" ]; then
            echo "Error: crd-ref-docs-config.yaml not found in scripts directory"
            exit 1
          fi

          envsubst < scripts/crd-ref-docs-config.yaml > crd-ref-docs-config.yaml

          echo "Changed to docs repository: $PWD"
          echo "Using config file:"
          cat crd-ref-docs-config.yaml

          # Generate API docs
          go run github.com/elastic/crd-ref-docs@v0.3.0 \
            --source-path="$GITHUB_WORKSPACE/kagent/$API_DIR/" \
            --renderer=markdown \
            --output-path ./ \
            --config=crd-ref-docs-config.yaml

          # Check if generation was successful
          if [ ! -f "./out.md" ]; then
            echo "Error: API docs generation failed - out.md not created"
            exit 1
          fi

          # Remove the temporary config file so it is not included in the PR
          rm -f crd-ref-docs-config.yaml

          # crd-ref-docs stamps every row of the Validation column with
          # `Required: \{\}` or `Optional: \{\}`. Hextra renders those escaped
          # braces as a literal `{}`, and optional is the default anyway, so drop
          # the optional marker outright and render the required one as bold
          # text. Marking required fields is the only thing v0.3.0 adds over
          # v0.2.0; without this normalization it adds 244 rows of noise instead.
          echo "Normalizing required/optional field markers..."
          python3 - <<'PY_MARKERS'
          from pathlib import Path

          path = Path("out.md")
          text = path.read_text()
          text = text.replace("Optional: \\{\\} <br />", "")
          text = text.replace("Required: \\{\\} <br />", "**Required** <br />")
          path.write_text(text)
          PY_MARKERS

          # Fix problematic angle brackets in the generated markdown.
          # Goldmark (unsafe: true) would otherwise treat stray <...> as raw HTML
          # and silently swallow it, so convert bare angle brackets to HTML
          # entities (they render literally). Preserve legitimate <br /> tags.
          echo "Fixing problematic angle brackets in generated markdown..."
          sed -i 's/<br \/>/__BR_TAG__/g' "./out.md"
          sed -i 's/</\&lt;/g' "./out.md"
          sed -i 's/>/\&gt;/g' "./out.md"
          sed -i 's/__BR_TAG__/<br \/>/g' "./out.md"

          # crd-ref-docs's markdown renderer emits multiple consecutive blank
          # lines around headings/descriptions. Collapse runs of 2+ blank
          # lines to a single one so regenerating doesn't churn whitespace
          # against the committed page on every run.
          echo "Collapsing excess blank lines..."
          sed -i ':a;N;$!ba;s/\n\{3,\}/\n\n/g' "./out.md"

          # Drop crd-ref-docs's default leading `# API Reference` H1: Hextra
          # renders the frontmatter title as the page H1, so a body H1 would
          # duplicate it (same reasoning as the Helm chart step below).
          sed -i '0,/^# /{/^# /d}' "./out.md"

          # The H1 removal leaves a blank line where the heading was; strip
          # leading blank lines so it doesn't stack with the frontmatter's
          # own trailing blank line once appended below.
          sed -i '/./,$!d' "./out.md"

          # Write the Hugo page: plain YAML frontmatter + generated body.
          mkdir -p "$(dirname "$KAGENT_API_PAGE")"
          # Frontmatter is per-line; linkTitle exists only on 0.x.
          {
            echo "---"
            echo "title: $API_TITLE"
            [ -n "$API_LINK_TITLE" ] && echo "linkTitle: $API_LINK_TITLE"
            echo "description: $API_DESC"
            echo "weight: $API_WEIGHT"
            echo "author: kagent.dev"
            echo "---"
            echo
          } > "$KAGENT_API_PAGE"
          cat "./out.md" >> "$KAGENT_API_PAGE"
          rm -f "./out.md"

          # Normalize to exactly one trailing newline. crd-ref-docs can leave
          # trailing blank lines at EOF that would otherwise churn on every
          # regeneration even though nothing meaningful changed.
          printf '%s\n' "$(cat "$KAGENT_API_PAGE")" > "$KAGENT_API_PAGE"

          # Verify the output file was created
          if [ ! -f "$KAGENT_API_PAGE" ]; then
            echo "Error: Failed to create API docs page"
            exit 1
          fi

          echo "API docs generated and processed successfully"

      - name: Verify KMCP API directory exists
        if: env.WITH_KMCP == 'true'
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/kmcp/api/v1alpha1" ]; then
            echo "Error: KMCP API directory not found at $GITHUB_WORKSPACE/kmcp/api/v1alpha1"
            ls -la "$GITHUB_WORKSPACE/kmcp/api/" || echo "kmcp/api directory not found"
            exit 1
          fi
          echo "KMCP API directory found and verified"

      - name: Generate KMCP API Reference
        if: env.WITH_KMCP == 'true'
        run: |
          # Substitute KUBE_VERSION in the config template and write to a temp file
          cd "$GITHUB_WORKSPACE/website"
          if [ ! -f "scripts/crd-ref-docs-config.yaml" ]; then
            echo "Error: crd-ref-docs-config.yaml not found in scripts directory"
            exit 1
          fi

          envsubst < scripts/crd-ref-docs-config.yaml > crd-ref-docs-config.yaml

          echo "Changed to docs repository: $PWD"
          echo "Using config file:"
          cat crd-ref-docs-config.yaml

          # Generate KMCP API docs
          go run github.com/elastic/crd-ref-docs@v0.3.0 \
            --source-path="$GITHUB_WORKSPACE/kmcp/api/v1alpha1/" \
            --renderer=markdown \
            --output-path ./ \
            --config=crd-ref-docs-config.yaml

          # Check if generation was successful
          if [ ! -f "./out.md" ]; then
            echo "Error: KMCP API docs generation failed - out.md not created"
            exit 1
          fi

          # Remove the temporary config file so it is not included in the PR
          rm -f crd-ref-docs-config.yaml

          # crd-ref-docs stamps every row of the Validation column with
          # `Required: \{\}` or `Optional: \{\}`. Hextra renders those escaped
          # braces as a literal `{}`, and optional is the default anyway, so drop
          # the optional marker outright and render the required one as bold
          # text. Marking required fields is the only thing v0.3.0 adds over
          # v0.2.0; without this normalization it adds 244 rows of noise instead.
          echo "Normalizing required/optional field markers..."
          python3 - <<'PY_MARKERS'
          from pathlib import Path

          path = Path("out.md")
          text = path.read_text()
          text = text.replace("Optional: \\{\\} <br />", "")
          text = text.replace("Required: \\{\\} <br />", "**Required** <br />")
          path.write_text(text)
          PY_MARKERS

          # Fix problematic angle brackets (see the kagent step for rationale).
          echo "Fixing problematic angle brackets in generated markdown..."
          sed -i 's/<br \/>/__BR_TAG__/g' "./out.md"
          sed -i 's/</\&lt;/g' "./out.md"
          sed -i 's/>/\&gt;/g' "./out.md"
          sed -i 's/__BR_TAG__/<br \/>/g' "./out.md"

          # See the kagent step above for rationale: collapse crd-ref-docs's
          # excess blank lines so this doesn't churn whitespace every run.
          echo "Collapsing excess blank lines..."
          sed -i ':a;N;$!ba;s/\n\{3,\}/\n\n/g' "./out.md"

          # See the kagent step above for rationale: drop the duplicate H1.
          sed -i '0,/^# /{/^# /d}' "./out.md"

          # See the kagent step above for rationale: strip the leading blank
          # line the H1 removal leaves behind.
          sed -i '/./,$!d' "./out.md"

          # Write the Hugo page: plain YAML frontmatter + generated body.
          mkdir -p "$(dirname "$KMCP_API_PAGE")"
          cat > "$KMCP_API_PAGE" <<'EOF'
          ---
          title: API Reference
          linkTitle: API docs
          description: kmcp API reference documentation
          weight: 5
          author: kagent.dev
          ---

          EOF
          cat "./out.md" >> "$KMCP_API_PAGE"
          rm -f "./out.md"

          # See the kagent step above for rationale: normalize trailing newline.
          printf '%s\n' "$(cat "$KMCP_API_PAGE")" > "$KMCP_API_PAGE"

          # Verify the output file was created
          if [ ! -f "$KMCP_API_PAGE" ]; then
            echo "Error: Failed to create KMCP API docs page"
            exit 1
          fi

          echo "KMCP API docs generated and processed successfully"

      - name: Generate Helm Chart Reference
        run: |
            echo "Looking for Helm directory:"
            ls -la "$GITHUB_WORKSPACE/kagent/helm" || echo "Helm directory not found!"

            # Update docs repository
            cd "$GITHUB_WORKSPACE/website"
            echo "Changed to docs repository: $PWD"

            # Generate Helm Docs for kagent chart
            if [ ! -d "$GITHUB_WORKSPACE/kagent/helm/kagent" ]; then
              echo "Error: kagent Helm chart directory not found"
              exit 1
            fi

            echo "Processing kagent Helm chart..."

            echo "Chart directory contents:"
            ls -la "$GITHUB_WORKSPACE/kagent/helm/kagent/"

            # Generate Chart.yaml from template for helm-docs to work
            echo "Generating Chart.yaml from template..."
            cd "$GITHUB_WORKSPACE/kagent/helm/kagent"

            # Get the version from git or use a default
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.5.5")
            echo "Using version: $VERSION"

            # Copy template and substitute version
            cp Chart-template.yaml Chart.yaml
            sed -i "s/\${VERSION}/$VERSION/g" Chart.yaml

            echo "Generated Chart.yaml contents:"
            cat Chart.yaml

            # Go back to website directory
            cd "$GITHUB_WORKSPACE/website"

            echo "Chart.yaml contents:"
            cat "$GITHUB_WORKSPACE/kagent/helm/kagent/Chart.yaml" || echo "Chart.yaml not found!"

            echo "Values.yaml contents (first 20 lines):"
            head -20 "$GITHUB_WORKSPACE/kagent/helm/kagent/values.yaml" || echo "values.yaml not found!"

            # Generate the helm documentation
            echo "Running helm-docs..."
            find "$GITHUB_WORKSPACE/kagent/helm" -name "Chart.yaml" -type f 2>/dev/null | head -10

            go run github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2 \
              --chart-search-root "$GITHUB_WORKSPACE/kagent/helm/kagent" \
              --dry-run > "helm-temp.md"

            echo "Generated helm-docs output (first 50 lines):"
            head -50 "helm-temp.md"
            echo "Total lines generated:"
            wc -l "helm-temp.md"

            # Remove the badge line and following empty line
            # (might be replaced by a helm-docs template in the future).
            sed -i '/!\[Version:/,/^$/d' "helm-temp.md"

            # Drop the leading `# <chart name>` H1: Hextra renders the frontmatter
            # title as the page H1, so a body H1 would duplicate it.
            sed -i '0,/^# /{/^# /d}' "helm-temp.md"

            # The H1 removal leaves a blank line where the heading was; strip
            # leading blank lines so it doesn't stack with the frontmatter's
            # own trailing blank line once appended into $HELM_PAGE below.
            sed -i '/./,$!d' "helm-temp.md"

            # Wrap version placeholders in inline code so they show literally.
            python - <<'PY'
            import re
            from pathlib import Path

            path = Path("helm-temp.md")
            text = path.read_text()
            for placeholder in ("${KMCP_VERSION}", "${SUBSTRATE_VERSION}", "${SUBSTRATE_REPO}"):
                text = text.replace(placeholder, "`" + placeholder + "`")

            # Wrap bare Helm/Go template expressions ({{ ... }}) in inline code.
            # Hugo renders them literally, but the MDX build (and copy-out to any
            # MDX consumer) parses {{ ... }} in prose as a JSX expression and
            # fails with "Could not parse expression with acorn" (e.g. the
            # extraObjects @default example). Existing inline-code spans are left
            # untouched so already-backticked templates are not double-wrapped.
            template = re.compile(r"\{\{.*?\}\}")
            code_span = re.compile(r"`[^`]*`")
            wrapped = []
            pos = 0
            for span in code_span.finditer(text):
                wrapped.append(template.sub(lambda m: "`" + m.group(0) + "`", text[pos:span.start()]))
                wrapped.append(span.group(0))
                pos = span.end()
            wrapped.append(template.sub(lambda m: "`" + m.group(0) + "`", text[pos:]))
            text = "".join(wrapped)

            path.write_text(text)
            PY

            # Write the Hugo page: plain YAML frontmatter + generated body.
            mkdir -p "$(dirname "$HELM_PAGE")"
            {
              echo "---"
              echo "title: $HELM_TITLE"
              [ -n "$HELM_LINK_TITLE" ] && echo "linkTitle: $HELM_LINK_TITLE"
              echo "description: $HELM_DESC"
              echo "weight: $HELM_WEIGHT"
              echo "author: kagent.dev"
              echo "---"
              echo
            } > "$HELM_PAGE"
            cat "helm-temp.md" >> "$HELM_PAGE"
            rm -f "helm-temp.md"

            # Normalize to exactly one trailing newline, same as the API ref
            # pages above.
            printf '%s\n' "$(cat "$HELM_PAGE")" > "$HELM_PAGE"

            echo "Final generated file contents (first 50 lines):"
            head -50 "$HELM_PAGE"

      - name: Install Python deps for CLI doc generation
        run: pip3 install --user pyyaml

      - name: Build kagent CLI binary
        run: |
          # kagent is a single-module monorepo rooted at go/, not the repo root.
          cd "$GITHUB_WORKSPACE/kagent/go"
          go build -o /tmp/kagent-cli ./core/cli/cmd/kagent
          /tmp/kagent-cli --help > /dev/null
          echo "kagent CLI binary built and smoke-tested successfully"

      - name: Build kmcp CLI binary
        if: env.WITH_KMCP == 'true'
        run: |
          cd "$GITHUB_WORKSPACE/kmcp"
          go build -o /tmp/kmcp-cli ./cmd/kmcp
          /tmp/kmcp-cli --help > /dev/null
          echo "kmcp CLI binary built and smoke-tested successfully"

      - name: Generate kagent CLI reference docs
        # CLI_WEIGHT is 30 on 1.x, slotting these after api-ref (10) and helm
        # (20); the generator's default of 1 would sort them above the API
        # reference. 0.x keeps 1, which is how its committed pages are ordered.
        # kmcp's section deliberately leads with the CLI, so its step below
        # keeps the default either way.
        run: |
          cd "$GITHUB_WORKSPACE/website"
          mkdir -p "$KAGENT_CLI_DIR"
          # --link-prefix only on 1.x. 0.x is not rebased into the enterprise
          # hub, so its generated cross-links stay root-relative URLs, and
          # passing an empty prefix is not the same as passing none.
          LINK_PREFIX_ARG=()
          if [ -n "$KAGENT_CLI_LINK_PREFIX" ]; then
            LINK_PREFIX_ARG=(--link-prefix "$KAGENT_CLI_LINK_PREFIX")
          fi
          python3 scripts/generate-cli-docs.py \
            --binary /tmp/kagent-cli \
            --display-name kagent \
            --out-dir "$KAGENT_CLI_DIR" \
            --url-prefix "$KAGENT_CLI_URL_PREFIX" \
            "${LINK_PREFIX_ARG[@]}" \
            --weight "$CLI_WEIGHT"

      - name: Generate kmcp CLI reference docs
        if: env.WITH_KMCP == 'true'
        run: |
          cd "$GITHUB_WORKSPACE/website"
          mkdir -p "$KMCP_CLI_DIR"
          python3 scripts/generate-cli-docs.py \
            --binary /tmp/kmcp-cli \
            --display-name kmcp \
            --out-dir "$KMCP_CLI_DIR" \
            --url-prefix "$KMCP_CLI_URL_PREFIX"

      - name: Audit generated CLI docs
        run: |
          cd "$GITHUB_WORKSPACE/website"
          # Audit only what this run generated; on 0.x the kmcp pages are untouched.
          if [ "$WITH_KMCP" = "true" ]; then
            python3 scripts/audit-cli-docs.py "$KAGENT_CLI_DIR" "$KMCP_CLI_DIR"
          else
            python3 scripts/audit-cli-docs.py "$KAGENT_CLI_DIR"
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: website
          commit-message: "docs: Update kagent ${{ env.LINE }} reference docs at ${{ env.KAGENT_TAG }}"
          signoff: true
          title: "Update kagent ${{ env.LINE }} reference docs at ${{ env.KAGENT_TAG }}${{ env.CONREFS_CHANGED && ' (version conrefs changed)' || '' }}"
          body: |
            Regenerates the kagent **${{ env.LINE }}** API and Helm references, its CLI pages, and the version conrefs at a released tag. Nothing here was read from either repository's `main`:
            - **kagent**: [`${{ env.KAGENT_TAG }}`](https://github.com/${{ github.repository_owner }}/kagent/releases/tag/${{ env.KAGENT_TAG }}) (`${{ env.KAGENT_COMMIT }}`)
            ${{ env.KMCP_SOURCE_LINE }}

            The `${{ env.LINE }}` span of `versions/kagent.md` moves to `${{ env.KAGENT_VERSION }}`, so the `helm install --version` lines on those pages and the reference content beside them describe the same release. Only this line's spans were written; the other line's are asserted unchanged.

            ${{ env.LINE_SCOPE_NOTE }}

            ${{ env.CONREF_NOTE }}

            ${{ env.RUNTIME_IMAGE_NOTE }}

            Version conrefs in this run. Each is read from the same place kagent's own build reads it, at the tag above, except the two runtime images, which are resolved from the registry because a digest exists only once the image is pushed:

            | Conref | Value | Source |
            | ------ | ----- | ------ |
            | `kagent` (${{ env.LINE }} span) | `${{ env.KAGENT_VERSION }}` | the release tag this run documents |
            | `agent-substrate` (${{ env.LINE }} span) | `${{ env.SUBSTRATE_VERSION }}` | `go/go.mod` replace target |
            | `max-kube` (${{ env.LINE }} span) | `${{ env.MAX_KUBE }}` | `Makefile` `KIND_IMAGE_VERSION` |
            ${{ env.FLAT_CONREF_ROWS }}

            Unchanged conref values are normal: most runs touch only the generated reference pages.

            This PR was automatically generated by the [**Update Reference documentation** workflow](https://github.com/${{ github.repository_owner }}/website/actions/workflows/update-ref-docs.yaml).
          # One branch per line: a 0.x run must not force-push over an open 1.x
          # regeneration PR, and the two carry unrelated diffs.
          branch: api-gen-update-${{ env.LINE }}
          delete-branch: true
          base: main
          labels: |
            documentation
            automated pr
