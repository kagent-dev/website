# The docs are served as a static sub-site under /docs of the kagent.dev origin
# (the Next.js marketing worker owns everything else). A baseURL with the /docs
# path prefix namespaces every emitted URL (pages AND css/js/images/favicons)
# under /docs, so Hugo's output drops cleanly into the worker's public/docs/
# static assets with no collisions against the marketing site's /images, etc.
# Content lives at content/<product>/ (NOT content/docs/) so the /docs prefix
# comes only from baseURL and isn't doubled.
baseURL: "https://kagent.dev/docs/"
enableRobotsTXT: true
# Derive each page's .Lastmod from its last git commit — no manually maintained
# front-matter dates. Feeds the sitemap <lastmod> for SEO. Listing "lastmod"
# before ":git" keeps an explicit front-matter date ahead of the commit date
# where a page sets one.
enableGitInfo: true
frontmatter:
  lastmod: ["lastmod", ":git", "date", "publishDate"]
# canonifyURLs must stay off with a subpath baseURL: it would rewrite already
# root-relative links (/docs/…) and relURL-built asset paths against baseURL and
# double the /docs prefix. The theme uses relURL, which already honors the
# subpath, so canonify is unnecessary here.
canonifyURLs: false
title: "kagent docs"

outputs:
  home: [HTML, RSS, llms]
  page: [HTML, markdown]
  section: [HTML, RSS, markdown, llms]

defaultContentLanguage: en

module:
  imports:
    # docs-theme-extras declares the hextra import itself; consumers do not
    # need to list hextra separately. Extras layouts win over the transitively
    # imported hextra ones.
    - path: github.com/solo-io/docs-theme-extras
  mounts:
    - source: "assets"
      target: "assets"
    - source: "hugo_stats.json"
      target: "assets/watching/hugo_stats.json"

build:
  writeStats: true
  cachebusters:
    - source: "assets/watching/hugo_stats\\.json"
      target: "styles\\.css"
    - source: "(postcss|tailwind)\\.config\\.js"
      target: "css"
    - source: "assets/.*\\.(js|ts|jsx|tsx)"
      target: "js"
    - source: "assets/.*\\.(.*)$"
      target: "$1"

caches:
  getresource:
    dir: ":cacheDir/:project"
    maxAge: 1h

markup:
  goldmark:
    extensions:
      extras:
        superscript:
          enable: true
    renderer:
      unsafe: true
  highlight:
    noClasses: false

enableInlineShortcodes: true

# kmcp is registered under params.sections to scope the version dropdown (so
# kagent's 0.x/1.x never appear on kmcp pages) and to put both doc sets in the
# navbar section selector. It nests no version tree of its own, which is the
# shape docs-theme-extras warns about on every build. That registration is
# deliberate here, and the module documents allowlisting the warning as the way
# to say so.
ignoreLogs:
  - extras-section-hollow

params:
  # Section registry, alphabetical. A section exists because it is a key here.
  # See docs-theme-extras USAGE.md, "Versions and sections".
  #
  # kagent docs are two parallel doc sets with NO version axis, which is what
  # `sections` models — the theme resolves them positionally (one segment below
  # the docs root) precisely because no version can follow them. Registering
  # them here is what gives this site the navbar section selector, the mobile
  # drawer's section chips, and a left nav rooted at the CURRENT doc set instead
  # of at site.Home. Before it, this repo carried a hand-written sidebar
  # override to get that last part; registering the sections replaced it.
  #
  # No `title` on either: both take their label from their landing page's title
  # ("kagent", "kmcp"), which is where it belongs.
  #
  # `icon` keeps the product marks the hand-rolled menu.main dropdown showed.
  # These are the SAME files navbar-link.html inlines for the marketing nav
  # (assets/icons/nav-<name>.svg) — the theme's utils/render-icon.html resolves
  # an `assets/` svg directly, so nothing had to move into static/. Paths are
  # assets-relative and include the extension; a value the resolver cannot match
  # falls through to a Material Icons ligature and renders as literal text, so a
  # typo here shows up on the page rather than failing the build.
  #
  # Registration only — a section's version list is NOT a sub-key here. The
  # `sections.<x>.versions` shape this file used through docs-theme-extras
  # v0.2.0 was removed in v0.2.2; every version now lives in the single
  # top-level `versions` list below and names the sections it belongs to. See
  # `versions` for why that single list is load-bearing, and the module's
  # utils/resolve-section-versions.html for the removal rationale.
  sections:
    kagent:
      icon: icons/nav-kagent.svg
    kmcp:
      icon: icons/nav-kmcp.svg

  # THE version list — docs-theme-extras reads this key and no other. Each entry
  # names the sections it applies to, and an entry with no `sections` applies to
  # every section. kagent is the only versioned doc set on this site, so its
  # entries are tagged `[kagent]` and kmcp — the other product built into this
  # same Hugo site — resolves to an empty list and renders no version dropdown.
  #
  # Tagging is what keeps this ONE list rather than two. Before v0.2.2 a section
  # could carry its own `sections.<x>.versions`, and everything that reads
  # site.Params.versions directly was blind to it: the `version` shortcode (so
  # every {{< version include-if="1.x" >}} inside assets/kagent-docs/versions/*.md
  # rendered EMPTY, blanking the version table on reference/versions.md with no
  # error), flexsearch's visibleVersions, the version banner, and the noindex
  # partial. A clean build with blank version numbers is the failure mode this
  # single list prevents.
  #
  # 0.x is the frozen pre-1.0 doc set (moved verbatim from the former flat
  # content/kagent/ tree); 1.x is the in-progress v1alpha3/Agent Substrate
  # rewrite and carries an in-development banner until it's ready to become
  # the default.
  #
  # Declaring versions at all moves section resolution off the theme's
  # version-less positional path (utils/section-segment.html condition (c)) and
  # onto the versioned path, where a section is recognized only directly above a
  # version tree — condition (a) — or as its own landing page — condition (b).
  # kagent satisfies (a): /docs/kagent/<0.x|1.x>/…. kmcp has no version tree, so
  # it satisfies (a) nowhere and (b) only on its own landing page, /docs/kmcp/.
  # Every kmcp page below that resolves to no section and falls back to a left
  # nav rooted at site.Home — which is why layouts/_partials/sidebar.html carries
  # a local override. Verify a kmcp sub-page's sidebar after any change here.
  versions:
    - version: "0.x"
      dropdown: "0.x (current)"
      linkVersion: "0.x"
      url: "/kagent/0.x"
      sections: ["kagent"]
      # `latest` marks the current release, and it is one of only two signals
      # docs-theme-extras' utils/version-noindex.html accepts (the other is a
      # `linkVersion: "latest"` URL segment, which this site does not use).
      # Without it the partial matches nothing and emits no robots meta at all,
      # so no version is ever marked as superseding another. 0.x is correct
      # today: kagent v0.10.1 is the released chart.
      #
      # It changes nothing in the current production build, because 1.x is
      # draft and no second version is rendered. It starts mattering the moment
      # 1.x publishes: the partial noindexes a NON-latest page whenever the same
      # page exists in the latest version, so with `latest` left here, 1.x pages
      # that duplicate a 0.x page would be noindexed — the theme's deliberate
      # "unreleased docs should not outrank the current release" behavior.
      # Whether 1.0 takes `latest` over at release is an open decision; see
      # RELEASE-1.0-CHECKLIST.md.
      latest: true
    # The "1.x" entry is deliberately absent until the 1.0 release is announced.
    # This list drives the version switcher independently of whether the pages
    # exist, so leaving the entry here while the content is drafted publishes a
    # "1.x (preview)" menu item pointing at a 404. hugo.preview.yaml layers it
    # back for local authoring; restore it here alongside dropping the draft keys
    # in content/kagent/1.x/_index.md:
    #
    #   - version: "1.x"
    #     dropdown: "1.x (preview)"
    #     linkVersion: "1.x"
    #     url: "/kagent/1.x"
    #     sections: ["kagent"]
    #     banner: "This is preview documentation for the upcoming kagent 1.0 release. It is incomplete and may change without notice."

  # Label on the section selector button. Without it the button falls back to
  # site.Title ("kagent docs"), which reads oddly above a menu offering kagent
  # and kmcp. Matches the "Docs" label the hand-rolled menu dropdown used.
  product: "Docs"

  # The docs root segment, as it appears in every page's RelPermalink. It comes
  # from the /docs/ path on baseURL, not from a content directory, but the theme
  # cannot tell those apart: navbar.html finds the version segment by counting
  # segments from the left, and it counts one for `folder` only when this is set
  # AND the URL actually starts with it. Unset, the count is one short on this
  # site — /docs/kagent/0.x/… yields "kagent" as the version, nothing matches,
  # and the version dropdown silently does not render at all.
  #
  # `hugo server` keeps the path component of baseURL, so the prefix test holds
  # locally as well as in production.
  #
  # This is NOT where the PDF link's product segment comes from, even though
  # `folder` sits in that fallback chain — pdfDownload.product below is set
  # explicitly and wins.
  folder: docs

  # Hide the visible "Last updated on <date>" footer (imported OSS content
  # modules ship displayUpdatedDate=true; this overrides it). The git date still
  # feeds the sitemap <lastmod> for SEO.
  displayUpdatedDate: false

  # Default social-share image for OpenGraph / Twitter cards (og:image),
  # emitted by Hextra's opengraph.html and docs-theme-extras' twitter_cards.html.
  # Requires a raster card committed at static/ogimage.png (agw-oss uses a
  # 1280x720 PNG). Until that asset exists this points at a 404 and no card
  # image is shown. Note: the main kagent.dev marketing site is Next.js and
  # sets its own OG image; this only affects the Hugo docs-site.
  images:
    - /ogimage.png

  # Load the docs-theme-extras OSS brand layer (brand-oss.css + Open Sans).
  # This is what gives the navbar search its rounded/padded look and keeps
  # styling consistent with the other Solo OSS docs sites (agw, kgw).
  themeExtras:
    brand: oss
    prodHost: "https://kagent.dev"

  # "Download all docs (PDF)" in the Copy-as-Markdown menu on docs pages, added by
  # the module's copy-markdown.html. Setting `distribution` turns the item on and
  # selects the solo-io/docs-pdfs release-asset URL shape, which the module
  # supplies so it is not repeated per consumer:
  #
  #   .../releases/download/{product}-{distribution}-{version}/{product}-{distribution}-{version}.pdf
  #
  # `oss` because kagent also ships as an enterprise product, whose manual
  # publishes to `kagent-enterprise-latest`. Telling those two apart is the whole
  # job of this segment.
  #
  # `{version}` resolves to `kagent-latest` or `kmcp-latest`. This site has no
  # versions at all, so the theme substitutes `latest`, and it prefixes that with
  # the section because `params.sections` is registered — without the prefix both
  # doc sets would resolve to one URL, and the publishing workflow uploads with
  # --clobber, so whichever rendered last would silently sit behind the link on
  # both. That substitution needs docs-theme-extras v0.3.8-beta.1 or later; on the
  # v0.3.3 this site used to pin, no amount of configuration here produced a link.
  #
  # `product` is set explicitly because it is otherwise read from
  # `params.currentProduct` or `params.folder`, and this site sets neither.
  # `params.product` below is NOT that field — it is the section-selector button
  # label ("Docs") and is not in the fallback chain.
  pdfDownload:
    distribution: oss
    product: kagent

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/kagent-logo-light.svg
      dark: images/kagent-logo-dark.svg
      # The docs are served under /docs, so the Hugo home is the /docs landing.
      # Point the logo at the site root (/) — the Next.js marketing home — instead.
      # navbar-title.html emits this link raw (no relURL), so it stays "/" and
      # isn't prefixed with /docs.
      link: /
      width: 126
      height: 28
  theme:
    # Auto-render the light/dark toggle in the navbar
    displayToggle: true

# Top nav — mirrors kagent.dev. Docs is local; the marketing/blog sections stay
# on the Next.js site, so those link out to absolute kagent.dev URLs.
menu:
  main:
    # NOTE: the whole "Docs" entry is gone, children and parent alike. It used to
    # be a hand-rolled stand-in for the theme's section selector: a parent named
    # "Docs" with kagent / kmcp children. params.sections above now renders that
    # same control, with the same two destinations and the same product marks
    # (the theme's `icon` key reads the identical assets/icons/nav-<name>.svg
    # files), and the selector's own button is labelled from params.product —
    # also "Docs". Keeping the menu entry put TWO buttons reading "Docs" side by
    # side in the navbar.
    #
    # Removing the parent costs no navigation. navbar-link.html renders any item
    # with children as a `<button>`, not an `<a>`, so the old parent's `url: /`
    # was never followable — the docs landing page was already reachable only
    # from the selector's items, the sidebar and the logo. Note menu urls are
    # relative to baseURL, so Hugo prepends the /docs subpath automatically; any
    # entry added back here wants a logical path (/, /kagent), NOT /docs/….
    #
    # navbar-link.html's `params.icon` handling stays in use for the remaining
    # items (see the GitHub entry below), so nothing there went dead.
    #
    # Marketing pages are served on the SAME origin (the Next.js worker), at the
    # site root — not under the docs' /docs baseURL. Use params.localHref (emitted
    # verbatim by navbar-link.html) so these stay root-relative and clicking stays
    # on the current host instead of jumping to production kagent.dev.
    - name: Blog
      weight: 2
      params:
        localHref: /blog
    - name: Tools
      weight: 3
      params:
        localHref: /tools
    - name: Agents
      weight: 4
      params:
        localHref: /agents
    - name: Community
      weight: 5
      params:
        localHref: /community
    - name: Enterprise
      weight: 6
      params:
        localHref: /enterprise
    - name: Search
      weight: 7
      params:
        type: search
    - name: GitHub
      url: https://github.com/kagent-dev/kagent
      weight: 8
      params:
        icon: github
