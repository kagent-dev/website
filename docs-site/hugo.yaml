# The docs are served as a static sub-site under /docs of the kagent.dev origin
# (the Next.js marketing worker owns everything else). A baseURL with the /docs
# path prefix namespaces every emitted URL (pages AND css/js/images/favicons)
# under /docs, so Hugo's output drops cleanly into the worker's public/docs/
# static assets with no collisions against the marketing site's /images, etc.
# Content lives at content/<product>/ (NOT content/docs/) so the /docs prefix
# comes only from baseURL and isn't doubled.
baseURL: "https://kagent.dev/docs/"
enableRobotsTXT: true
# Derive each page's .Lastmod from its last git commit — no manually maintained
# front-matter dates. Feeds the sitemap <lastmod> for SEO. Listing "lastmod"
# before ":git" keeps an explicit front-matter date ahead of the commit date
# where a page sets one.
enableGitInfo: true
frontmatter:
  lastmod: ["lastmod", ":git", "date", "publishDate"]
# canonifyURLs must stay off with a subpath baseURL: it would rewrite already
# root-relative links (/docs/…) and relURL-built asset paths against baseURL and
# double the /docs prefix. The theme uses relURL, which already honors the
# subpath, so canonify is unnecessary here.
canonifyURLs: false
title: "kagent docs"

outputs:
  home: [HTML, RSS, llms]
  page: [HTML, markdown]
  section: [HTML, RSS, markdown, llms]

defaultContentLanguage: en

module:
  imports:
    # docs-theme-extras declares the hextra import itself; consumers do not
    # need to list hextra separately. Extras layouts win over the transitively
    # imported hextra ones.
    - path: github.com/solo-io/docs-theme-extras
  mounts:
    - source: "assets"
      target: "assets"
    - source: "hugo_stats.json"
      target: "assets/watching/hugo_stats.json"

build:
  writeStats: true
  cachebusters:
    - source: "assets/watching/hugo_stats\\.json"
      target: "styles\\.css"
    - source: "(postcss|tailwind)\\.config\\.js"
      target: "css"
    - source: "assets/.*\\.(js|ts|jsx|tsx)"
      target: "js"
    - source: "assets/.*\\.(.*)$"
      target: "$1"

caches:
  getresource:
    dir: ":cacheDir/:project"
    maxAge: 1h

markup:
  goldmark:
    extensions:
      extras:
        superscript:
          enable: true
    renderer:
      unsafe: true
  highlight:
    noClasses: false

enableInlineShortcodes: true

params:
  # Section registry, alphabetical. A section exists because it is a key here.
  # See docs-theme-extras USAGE.md, "Versions and sections".
  #
  # kagent docs are two parallel doc sets with NO version axis, which is what
  # `sections` models — the theme resolves them positionally (one segment below
  # the docs root) precisely because no version can follow them. Registering
  # them here is what gives this site the navbar section selector, the mobile
  # drawer's section chips, and a left nav rooted at the CURRENT doc set instead
  # of at site.Home. Before it, this repo carried a hand-written sidebar
  # override to get that last part; registering the sections replaced it.
  #
  # No `title` on either: both take their label from their landing page's title
  # ("kagent", "kmcp"), which is where it belongs.
  #
  # `icon` keeps the product marks the hand-rolled menu.main dropdown showed.
  # These are the SAME files navbar-link.html inlines for the marketing nav
  # (assets/icons/nav-<name>.svg) — the theme's utils/render-icon.html resolves
  # an `assets/` svg directly, so nothing had to move into static/. Paths are
  # assets-relative and include the extension; a value the resolver cannot match
  # falls through to a Material Icons ligature and renders as literal text, so a
  # typo here shows up on the page rather than failing the build.
  #
  # Do NOT add params.versions to make something else work. These sections
  # resolve through the theme's version-less path, and a single version entry
  # moves the whole site onto the versioned path, where a section is only
  # recognized directly above a version tree — of which this site has none.
  sections:
    kagent:
      icon: icons/nav-kagent.svg
    kmcp:
      icon: icons/nav-kmcp.svg

  # Label on the section selector button. Without it the button falls back to
  # site.Title ("kagent docs"), which reads oddly above a menu offering kagent
  # and kmcp. Matches the "Docs" label the hand-rolled menu dropdown used.
  product: "Docs"

  # Hide the visible "Last updated on <date>" footer (imported OSS content
  # modules ship displayUpdatedDate=true; this overrides it). The git date still
  # feeds the sitemap <lastmod> for SEO.
  displayUpdatedDate: false

  # Default social-share image for OpenGraph / Twitter cards (og:image),
  # emitted by Hextra's opengraph.html and docs-theme-extras' twitter_cards.html.
  # Requires a raster card committed at static/ogimage.png (agw-oss uses a
  # 1280x720 PNG). Until that asset exists this points at a 404 and no card
  # image is shown. Note: the main kagent.dev marketing site is Next.js and
  # sets its own OG image; this only affects the Hugo docs-site.
  images:
    - /ogimage.png

  # Load the docs-theme-extras OSS brand layer (brand-oss.css + Open Sans).
  # This is what gives the navbar search its rounded/padded look and keeps
  # styling consistent with the other Solo OSS docs sites (agw, kgw).
  themeExtras:
    brand: oss
    prodHost: "https://kagent.dev"
  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/kagent-logo-light.svg
      dark: images/kagent-logo-dark.svg
      # The docs are served under /docs, so the Hugo home is the /docs landing.
      # Point the logo at the site root (/) — the Next.js marketing home — instead.
      # navbar-title.html emits this link raw (no relURL), so it stays "/" and
      # isn't prefixed with /docs.
      link: /
      width: 126
      height: 28
  theme:
    # Auto-render the light/dark toggle in the navbar
    displayToggle: true

# Top nav — mirrors kagent.dev. Docs is local; the marketing/blog sections stay
# on the Next.js site, so those link out to absolute kagent.dev URLs.
menu:
  main:
    # NOTE: the whole "Docs" entry is gone, children and parent alike. It used to
    # be a hand-rolled stand-in for the theme's section selector: a parent named
    # "Docs" with kagent / kmcp children. params.sections above now renders that
    # same control, with the same two destinations and the same product marks
    # (the theme's `icon` key reads the identical assets/icons/nav-<name>.svg
    # files), and the selector's own button is labelled from params.product —
    # also "Docs". Keeping the menu entry put TWO buttons reading "Docs" side by
    # side in the navbar.
    #
    # Removing the parent costs no navigation. navbar-link.html renders any item
    # with children as a `<button>`, not an `<a>`, so the old parent's `url: /`
    # was never followable — the docs landing page was already reachable only
    # from the selector's items, the sidebar and the logo. Note menu urls are
    # relative to baseURL, so Hugo prepends the /docs subpath automatically; any
    # entry added back here wants a logical path (/, /kagent), NOT /docs/….
    #
    # navbar-link.html's `params.icon` handling stays in use for the remaining
    # items (see the GitHub entry below), so nothing there went dead.
    #
    # Marketing pages are served on the SAME origin (the Next.js worker), at the
    # site root — not under the docs' /docs baseURL. Use params.localHref (emitted
    # verbatim by navbar-link.html) so these stay root-relative and clicking stays
    # on the current host instead of jumping to production kagent.dev.
    - name: Blog
      weight: 2
      params:
        localHref: /blog
    - name: Tools
      weight: 3
      params:
        localHref: /tools
    - name: Agents
      weight: 4
      params:
        localHref: /agents
    - name: Community
      weight: 5
      params:
        localHref: /community
    - name: Enterprise
      weight: 6
      params:
        localHref: /enterprise
    - name: Search
      weight: 7
      params:
        type: search
    - name: GitHub
      url: https://github.com/kagent-dev/kagent
      weight: 8
      params:
        icon: github
