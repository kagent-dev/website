# Preview/authoring overlay. Layered on top of hugo.yaml with
# `--config hugo.yaml,hugo.preview.yaml`, and never used by the production build.
#
# Restores the "1.x" versions entry that hugo.yaml deliberately omits while 1.x is
# withheld. That list does two jobs, and hiding 1.x from the published site breaks
# the second one:
#   1. It drives the version switcher, which is why the entry is absent in production.
#   2. The {{< version >}} shortcode iterates it and emits only on a linkVersion
#      match, so with no 1.x entry every {{< version include-if="1.x" >}} renders
#      EMPTY -- blanking the conref'd version numbers in assets/kagent-docs/versions/
#      wherever a page reuses them, including the component table on
#      reference/versions.md. No error, clean build, broken copy-paste commands.
#
# Hugo REPLACES a list-valued param rather than merging it, so this restates the
# 0.x entry; an overlay holding 1.x alone would drop 0.x from the preview.
#
# Delete this file at the 1.0 release, when the entry returns to hugo.yaml
# alongside dropping the draft keys in content/kagent/1.x/_index.md.
params:
  versions:
    - version: "0.x"
      dropdown: "0.x (current)"
      linkVersion: "0.x"
      url: "/kagent/0.x"
      sections: ["kagent"]
    - version: "1.x"
      dropdown: "1.x (preview)"
      linkVersion: "1.x"
      url: "/kagent/1.x"
      sections: ["kagent"]
      banner: "This is preview documentation for the upcoming kagent 1.0 release. It is incomplete and may change without notice."
